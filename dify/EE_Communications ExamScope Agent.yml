    - data:
        code: "def main(school_a, school_b):\n    alias_map = {\n        # 武汉大学\n\
          \        \"武大\": \"武汉大学\",\n        \"武汉大学\": \"武汉大学\",\n        \"WHU\"\
          : \"武汉大学\",\n\n        # 浙江大学\n        \"浙大\": \"浙江大学\",\n        \"浙江大学\"\
          : \"浙江大学\",\n        \"ZJU\": \"浙江大学\",\n\n        # 北京理工大学\n        \"\
          北理工\": \"北京理工大学\",\n        \"北理\": \"北京理工大学\",\n        \"北京理工大学\": \"\
          北京理工大学\",\n        \"BIT\": \"北京理工大学\",\n\n        # 大连理工大学\n        \"\
          大工\": \"大连理工大学\",\n        \"大连理工\": \"大连理工大学\",\n        \"大连理工大学\": \"\
          大连理工大学\",\n        \"DUT\": \"大连理工大学\",\n    }\n\n    def normalize(name):\n\
          \        if not name:\n            return \"\"\n\n        # 去除首尾空格，并转换为小写进行匹配\n\
          \        text = str(name).strip()\n        lower_text = text.lower()\n\n\
          \        # 优先匹配原样（处理大小写混合的英文缩写）\n        if text in alias_map:\n       \
