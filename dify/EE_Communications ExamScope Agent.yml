    - data:
        code: "def main(\n    intent,\n    school_a_normalized,\n    school_b_normalized,\n\
          \    major,\n    admission_year,\n    admission_year_b,\n    baseline,\n\
          \    daily_hours,\n    known_topics,\n    isZeroBase  # <--- 新增的布尔值变量\n\
          ):\n    def clean(value):\n        if value is None:\n            return\
          \ \"\"\n        return str(value).strip()\n\n    intent = clean(intent)\n\
          \    school_a = clean(school_a_normalized)\n    school_b = clean(school_b_normalized)\n\
          \    major = clean(major)\n    admission_year = clean(admission_year)\n\
          \    admission_year_b = clean(admission_year_b)\n    baseline = clean(baseline)\n\
          \n    if not isinstance(known_topics, list):\n        known_topics = []\n\
          \n    valid_intents = [\"single_query\", \"compare\", \"study_plan\"]\n\
          \    valid_baselines = [\n        \"尚未系统学过\",\n        \"学过但遗忘较多\",\n  \
          \      \"基础比较熟悉\",\n        \"已完成基础复习，想进阶拔高\"\n    ]\n    \n    valid_schools\
          \ = [\n        \"北京理工大学\", \"大连理工大学\", \"武汉大学\", \"浙江大学\"\n    ]\n\n   \
          \ # 1. 拦截：意图不支持\n    if intent not in valid_intents:\n        return {\n\
          \            \"need_clarification\": True,\n            \"clarification_message\"\
          : (\n                \"我目前只支持以下功能：①查询一所学校的专业课，\"\n                \"②比较两所学校的考试范围，或③根据自己的基础制定备考建议。\"\
          \n                \"请同时告诉我目标院校、目标专业或方向，以及拟入学年份（如“2027”）。\"\n           \
          \ ),\n            \"intent\": \"unknown\",\n            \"query_a\": \"\"\
          , \"query_b\": \"\", \"known_topics_text\": \"\"\n        }\n\n    # 2.\
          \ 拦截：院校不在白名单内\n    if school_a and school_a not in valid_schools:\n    \
          \    return {\n            \"need_clarification\": True,\n            \"\
          clarification_message\": f\"抱歉，我目前暂不支持 {school_a} 的数据查询。\",\n          \
          \  \"intent\": \"unknown\",\n            \"query_a\": \"\", \"query_b\"\
          : \"\", \"known_topics_text\": \"\"\n        }\n        \n    if intent\
          \ == \"compare\" and school_b and school_b not in valid_schools:\n     \
          \   return {\n            \"need_clarification\": True,\n            \"\
          clarification_message\": f\"抱歉，对比功能暂不支持 {school_b}。\",\n            \"intent\"\
          : \"unknown\",\n            \"query_a\": \"\", \"query_b\": \"\", \"known_topics_text\"\
          : \"\"\n        }\n\n    # 3. 走正常的缺参数检查逻辑\n    year_valid = (\n        len(admission_year)\
          \ == 4\n        and admission_year.isdigit()\n        and 2020 <= int(admission_year)\
          \ <= 2100\n    )\n    \n    if intent == \"compare\" and not admission_year_b:\n\
          \        admission_year_b = admission_year\n\n    year_b_valid = (\n   \
          \     len(admission_year_b) == 4\n        and admission_year_b.isdigit()\n\
          \        and 2020 <= int(admission_year_b) <= 2100\n    )\n\n    try:\n\
          \        hours = float(daily_hours) if daily_hours is not None else 0\n\
          \    except:\n        hours = 0\n\n    missing = []\n\n    if not school_a:\n\
          \        missing.append(\"目标院校\")\n    if intent == \"compare\" and not\
          \ school_b:\n        missing.append(\"第二所院校\")\n    if not major:\n    \
          \    missing.append(\"目标专业或方向\")\n    if not year_valid:\n        missing.append(\"\
          目标院校拟入学年份（四位数，例如2027）\")\n    if intent == \"compare\" and not year_b_valid:\n\
          \        missing.append(\"第二所院校拟入学年份\")\n\n    if intent == \"study_plan\"\
          :\n        if baseline not in valid_baselines:\n            missing.append(\"\
          当前基础\")\n        if hours <= 0 or hours > 16:\n            missing.append(\"\
          每天可投入时间（小时）\")\n            \n        # ==========================================\n\
          \        # 核心：结合 isZeroBase 判断\n        # ==========================================\n\
          \        # 如果用户是零基础，但代码抓到的列表为空，我们直接帮他填个\"无\"\n        if isZeroBase and\
          \ len(known_topics) == 0:\n            known_topics = [\"无（零基础）\"]\n   \
          \         \n        # 只有既不是零基础，列表又是空的，才去拦截\n        if not isZeroBase and\
          \ len(known_topics) == 0:\n            missing.append(\"已经学过的知识点\")\n\n\
          \    need_clarification = len(missing) > 0\n\n    if need_clarification:\n\
          \        clarification = (\n            \"我已经理解你的大致需求，还需要补充：\"\n       \
          \     + \"、\".join(missing)\n            + \"。你可以直接在下一条消息中补充，不必重新描述全部内容。\"\
          \n        )\n    else:\n        clarification = \"\"\n\n    # ==========================================\n\
          \    # 拼接检索语句\n    # ==========================================\n    query_a\
          \ = (\n        f\"用户输入院校：{school_a}\\n\"\n        f\"标准院校名称：{school_a}\\\
          n\"\n        f\"专业或方向：{major}\\n\"\n        f\"拟入学年份：{admission_year}\\\
          n\"\n        \"查询专业课科目、考试范围、参考书目、分数线、招生人数及官方来源。\"\n    )\n\n    query_b\
          \ = \"\"\n    if school_b:\n        query_b = (\n            f\"用户输入院校：{school_b}\\\
          n\"\n            f\"标准院校名称：{school_b}\\n\"\n            f\"专业或方向：{major}\\\
          n\"\n            f\"拟入学年份：{admission_year_b}\\n\"\n            \"查询专业课科目、考试范围、参考书目、分数线、招生人数及官方来源。\"\
          \n        )\n\n    return {\n        \"need_clarification\": need_clarification,\n\
          \        \"clarification_message\": clarification,\n        \"intent\":\
          \ intent,\n        \"query_a\": query_a,\n        \"query_b\": query_b,\n\
          \        \"known_topics_text\": \"、\".join(known_topics)\n    }"
        code_language: python3
        desc: 把参数提取器的各个输出连接为代码节点输入
