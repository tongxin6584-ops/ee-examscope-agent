    - data:
        instruction: "你负责从用户当前消息和最近的对话历史中提取考研专业课需求。\n【意图分类】\n1. single_query：\n用户要查询一所院校的专业课、科目代码、考试范围、参考书目、分数线或招生人数。\n\
          2. compare：\n用户要比较两所院校的专业课、参考书目、考试范围、共同知识点或差异、分数线。\n3. study_plan：\n用户希望根据自己的基础、已学知识和可投入时间生成备考建议或学习顺序。\n\
          4. unknown：\n无法确定属于前三类，或用户只是泛泛表示“想考研电子通信专业”。\n【年份提取强制规则】\n1. 用户输入中如果包含任何四位数年份（如\
          \ 2024、2025、2026、2027），必须将其提取为 admission_year。\n2. 特别注意用户的习惯用语：\n   - \"\
          2027年考什么\"、\"27考研\"、\"2027届\"、\"目标2027年入学\" 等，统统视为 admission_year = \"2027\"\
          。\n3. 如果用户没有提及任何年份，admission_year 必须为空字符串 \"\"。\n4. 【示例】\n   用户输入：\"北理工的电子信息专业课2027年考什么？\"\
          \n   正确提取：{\"school_a\": \"北理工\", \"major\": \"电子信息\", \"admission_year\"\
          : \"2027\", \"intent\": \"single_query\"}\n【字段规则】\n- school_a：单校查询时为目标院校；比较时为第一所院校；备考建议时为目标院校。\n\
          - school_b：只在两校比较时填写。\n- major：专业名称或专业代码。\n- admission_year：指拟入学年份（在考研初试的后一年）。例如用户说“2027考研”时（指2026年底考试，2027年入学），如果语义无法确定是初试年份还是入学年份，不要自行换算，应留空并追问。\n\
          - baseline只能从以下四项选一个：\n  1. 尚未系统学过\n  2. 学过但遗忘较多\n  3. 基础比较熟悉\n  4. 已完成基础复习，想进阶拔高\n\
          - known_topics 从以下选项选取，可多选：\n  信号与系统、电路原理、模拟电路、数字电路、通信原理、数字信号处理、电磁场与电磁波、其他或不确定。\n\
          - 后一轮用户明确修改的信息优先于前一轮。\n- 可以利用对话历史补全前面已经明确提供的信息。\n- 不得猜测学校、年份、专业、基础或学习时间。\n\
          - 缺失字段输出空字符串、空数组或空值。\n【院校简称处理】\n如果用户使用院校简称，应尽量识别对应标准名称。\n当前知识库支持的院校简称关系如下：\n\
          - 武大 → 武汉大学\n- 北理工 → 北京理工大学\n- 大连理工 → 大连理工大学\n- 浙大→ 浙江大学\n- 其余院校别名按实际知识库补充\n\
          如果无法确定简称对应哪所院校，不得自行猜测，应保留用户原始输入并要求用户确认。"
